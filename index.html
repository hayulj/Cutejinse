<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            overflow: hidden;
        }
        #scareVideo {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }
        #clickArea {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            background: transparent;
        }
    </style>
</head>
<body>

    <div id="clickArea"></div>
    <video id="scareVideo" src="video.mp4" playsinline webkit-playsinline></video>

    <script>
        const clickArea = document.getElementById('clickArea');
        const video = document.getElementById('scareVideo');

        clickArea.addEventListener('click', function() {
            clickArea.style.display = 'none';
            video.style.display = 'block';
            
            // 1. 영상 재생
            video.play();

            // 2. 전체화면 시도 (지원되는 기기에서만 작동)
            if (video.webkitEnterFullscreen) {
                video.webkitEnterFullscreen();
            } else if (video.requestFullscreen) {
                video.requestFullscreen();
            }
        });
    </script>
</body>
</html>
